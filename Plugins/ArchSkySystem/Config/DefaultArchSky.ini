; ArchSky System - shipped defaults.
;
; HOW THIS FILE IS USED
; ---------------------
; UArchSkySettings is declared `config = Game, defaultconfig`, so the engine reads and
; writes its values in the PROJECT's DefaultGame.ini, not here. This file is the reference
; copy: paste the section below into your project's Config/DefaultGame.ini to start from
; the plugin's recommended settings, or edit the values in
; Project Settings > Plugins > ArchSky and let the editor write them for you.
;
; Every key below is documented in PERFORMANCE.md (the throttles) and README.md (the rest).

[/Script/ArchSkyRuntime.ArchSkySettings]

; --- Defaults applied when a level starts -------------------------------------------------
DefaultLocationId=Tehran
DefaultWeatherPresetId=Clear
DefaultCalendarType=Gregorian
DefaultTimeOfDayHours=10.000000
DefaultDayOfYear=172
DefaultYear=2026
bDefaultTo24HourClock=True

; Used only when DefaultLocationId is not found in the library.
FallbackLocation=(LatitudeDegrees=35.689200,LongitudeDegrees=51.389000,TimezoneOffsetHours=3.500000,bObserveDST=False,ElevationMeters=1200.000000)

; --- Rendering ----------------------------------------------------------------------------
; Volumetric (Path A) is the default. Switch to SkySphere for VR or low-end targets;
; see MATERIALS.md for what each path requires of your materials.
CloudMode=Volumetric

; 0.545 degrees is the sun's true angular diameter and produces the correct shadow
; penumbra. Raising it softens shadows artistically, not physically.
SunLightSourceAngleDegrees=0.545000
MoonLightSourceAngleDegrees=0.545000

; A full moon at the zenith is about 0.25 lux in reality. 0.4 is a mild artistic lift so
; that night interiors read on a display that is not calibrated for scotopic vision.
MoonPeakIlluminanceLux=0.400000

; The moon light cross-fades out across civil twilight rather than switching off.
MoonFadeOutStartSunAltitude=-6.000000
MoonFadeOutEndSunAltitude=0.000000

; Assign these in Project Settings if you want art-directed curves or the MPC contract.
; Leaving them empty uses the code-defined defaults, which are physically plausible.
; DefaultSunIntensityCurve=/Game/ArchSky/Curves/C_SunIntensity.C_SunIntensity
; DefaultSunColorTemperatureCurve=/Game/ArchSky/Curves/C_SunKelvin.C_SunKelvin
; SkyParameterCollection=/Game/ArchSky/Materials/MPC_ArchSky.MPC_ArchSky

; --- Performance --------------------------------------------------------------------------
; See PERFORMANCE.md for the cost of each knob and the recommended Desktop / VR / Low-end
; values. These are the Desktop defaults.
SkyRecaptureAltitudeThreshold=1.000000
SkyRecaptureWeatherThreshold=0.050000
MinFramesBetweenSkyRecaptures=30
CloudUpdateInterval=0.100000
SolarUpdateInterval=0.000000
bWriteMaterialParameterCollection=True
bEnableMoonLight=True

; --- Networking ---------------------------------------------------------------------------
; Off by default. With it off, every code path behaves exactly as it does in single player.
bEnableReplication=False
bAllowClientTimeControl=False
ReplicationUpdateFrequencyHz=2.000000

; --- Content ------------------------------------------------------------------------------
; Directories scanned by the Asset Manager for weather presets. The plugin's own Data
; folder is scanned by default; add your project's folder if you keep presets elsewhere.
+PresetScanPaths=(Path="/ArchSkySystem/Data")
; LocationLibrary=/Game/ArchSky/Data/DA_ArchLocations.DA_ArchLocations

; --- Debug --------------------------------------------------------------------------------
bShowStateHudByDefault=False
bWarnOnDuplicateDirectors=True
